<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>החווה בחבל — ניהול שעות</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #4a7c23 30%, #6b8f3a 60%, #8b6914 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #5c3d0e, #8b6914);
            padding: 28px 24px;
            text-align: center;
            color: white;
        }

        .header h1 { font-size: 1.5rem; margin-bottom: 6px; }
        .header p { font-size: 0.9rem; opacity: 0.85; }

        /* Login */
        .login-section {
            padding: 36px 28px;
            text-align: center;
        }

        .login-section h2 { color: #5c3d0e; margin-bottom: 20px; font-size: 1.1rem; }

        .login-section input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0d6c8;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 14px;
            font-family: inherit;
            text-align: center;
        }

        .login-section input:focus {
            outline: none;
            border-color: #4a7c23;
            box-shadow: 0 0 0 3px rgba(74,124,35,0.15);
        }

        .login-error {
            color: #e74c3c;
            font-size: 0.85rem;
            margin-bottom: 12px;
            display: none;
        }

        /* Admin panel */
        .admin-section { display: none; padding: 24px; }

        .section-title {
            color: #5c3d0e;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e8dcc8;
        }

        .slots-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .slot-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid #e0d6c8;
            background: #fefefe;
        }

        .slot-row.taken {
            border-color: #f5c6cb;
            background: #fff5f5;
        }

        .slot-time {
            font-size: 1rem;
            font-weight: 700;
            color: #333;
            direction: ltr;
        }

        .slot-badge {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-right: 8px;
        }

        .badge-free {
            background: #eef7e5;
            color: #2d5016;
        }

        .badge-taken {
            background: #fde8e8;
            color: #c0392b;
        }

        .slot-actions { display: flex; gap: 6px; align-items: center; }

        .btn-remove {
            padding: 5px 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-remove:hover { background: #c0392b; }

        .btn-restore {
            padding: 5px 12px;
            background: #4a7c23;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-restore:hover { background: #2d5016; }

        .add-slot-section {
            background: #f9f5ee;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .add-slot-section h3 {
            color: #5c3d0e;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .add-row {
            display: flex;
            gap: 8px;
        }

        .add-row input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #e0d6c8;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            direction: ltr;
            text-align: center;
        }

        .add-row input:focus {
            outline: none;
            border-color: #4a7c23;
        }

        .btn-add {
            padding: 10px 18px;
            background: linear-gradient(135deg, #4a7c23, #2d5016);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn-add:hover { opacity: 0.9; }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a7c23, #2d5016);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s;
        }

        .btn-main:hover { transform: translateY(-2px); }

        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
            font-size: 0.9rem;
        }

        .status-msg {
            text-align: center;
            font-size: 0.85rem;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }

        .status-msg.success { background: #eef7e5; color: #2d5016; display: block; }
        .status-msg.error { background: #fde8e8; color: #c0392b; display: block; }

        .footer {
            text-align: center;
            padding: 12px 24px 20px;
            color: #888;
            font-size: 0.78rem;
        }

        .footer a { color: #5c3d0e; text-decoration: none; font-weight: 600; }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { border-radius: 18px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🐴 ניהול שעות — החווה בחבל</h1>
        <p>פאנל ניהול שעות הרשמה</p>
    </div>

    <!-- Login -->
    <div class="login-section" id="loginSection">
        <h2>🔒 כניסה לממשק הניהול</h2>
        <input type="password" id="passwordInput" placeholder="סיסמה" onkeydown="if(event.key==='Enter') login()">
        <div class="login-error" id="loginError">סיסמה שגויה — נסה שוב</div>
        <button class="btn-main" onclick="login()">כניסה</button>
    </div>

    <!-- Admin panel -->
    <div class="admin-section" id="adminSection">
        <div class="status-msg" id="statusMsg"></div>

        <div class="section-title">⏰ שעות פעילות</div>
        <div class="slots-grid" id="slotsGrid">
            <div class="loading">טוען...</div>
        </div>

        <div class="add-slot-section">
            <h3>➕ הוספת שעה חדשה</h3>
            <div class="add-row">
                <input type="text" id="newSlot" placeholder="למשל: 16:00" maxlength="5">
                <button class="btn-add" onclick="addSlot()">הוסף</button>
            </div>
        </div>

        <button class="btn-main" onclick="loadSlots()" style="margin-bottom:8px;">🔄 רענן</button>
    </div>

    <div class="footer">
        <a href="index.html">← חזרה לדף ההרשמה</a>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRKJn-Tycnl1P-SNiOboS1STcqlfUEpUkSNBxJHUIXBBUUOy5Gqahp2TRx43UaTkjJ/exec';
    const ADMIN_PASSWORD = 'chavah2025'; // Change this to your preferred password

    function login() {
        const pw = document.getElementById('passwordInput').value;
        if (pw === ADMIN_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            loadSlots();
        } else {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('passwordInput').value = '';
        }
    }

    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.textContent = msg;
        el.className = 'status-msg ' + type;
        setTimeout(function() { el.className = 'status-msg'; }, 3000);
    }

    function ping(params) {
        var img = new Image();
        img.src = SCRIPT_URL + '?' + params;
    }

    function loadSlots() {
        var grid = document.getElementById('slotsGrid');
        grid.innerHTML = '<div class="loading">טוען...</div>';
        var cbName = 'admin_cb_' + Date.now();
        window[cbName] = function(slots) {
            renderSlots(slots);
            delete window[cbName];
        };
        var script = document.createElement('script');
        script.src = SCRIPT_URL + '?action=getAllSlots&callback=' + cbName + '&t=' + Date.now();
        script.onerror = function() {
            grid.innerHTML = '<div class="loading" style="color:#e74c3c">שגיאה בטעינה — נסה לרענן</div>';
        };
        document.head.appendChild(script);
    }

    function formatSlot(slot) {
        if (!slot || slot === 'זמן/יום אחר') return slot;
        if (/^\d{2}:\d{2}$/.test(slot)) return slot;
        var match = slot.match(/(\d{1,2}):(\d{2})/);
        if (match) return match[1].padStart(2, '0') + ':' + match[2];
        return slot;
    }

    function renderSlots(slots) {
        var grid = document.getElementById('slotsGrid');
        if (!slots.length) {
            grid.innerHTML = '<div class="loading">אין שעות מוגדרות</div>';
            return;
        }

        // Sort chronologically by formatted value
        slots.sort(function(a, b) {
            return formatSlot(a.slot).localeCompare(formatSlot(b.slot));
        });

        grid.innerHTML = slots.map(function(s) {
            var display = formatSlot(s.slot);
            var takenClass = s.taken ? ' taken' : '';
            var badge = s.taken
                ? '<span class="slot-badge badge-taken">תפוס</span>'
                : '<span class="slot-badge badge-free">פנוי</span>';
            var restoreBtn = s.taken
                ? '<button class="btn-restore" onclick="restoreSlot(\'' + display + '\')">פתח שוב</button>'
                : '';
            return '<div class="slot-row' + takenClass + '">' +
                '<span class="slot-time">' + display + '</span>' +
                '<div class="slot-actions">' + badge + restoreBtn +
                '<button class="btn-remove" onclick="removeSlot(\'' + display + '\')">הסר</button>' +
                '</div></div>';
        }).join('');
    }

    function addSlot() {
        var input = document.getElementById('newSlot');
        var slot = input.value.trim();
        if (!slot || !/^\d{2}:\d{2}$/.test(slot)) {
            showStatus('פורמט לא תקין — השתמש בפורמט HH:MM (למשל 09:00)', 'error');
            return;
        }
        ping('action=addSlot&slot=' + encodeURIComponent(slot));
        input.value = '';
        showStatus('השעה נוספה בהצלחה', 'success');
        setTimeout(loadSlots, 1500);
    }

    function removeSlot(slot) {
        if (!confirm('להסיר את השעה ' + slot + '?')) return;
        ping('action=removeSlot&slot=' + encodeURIComponent(slot));
        showStatus('השעה הוסרה', 'success');
        setTimeout(loadSlots, 1500);
    }

    function restoreSlot(slot) {
        ping('action=restoreSlot&slot=' + encodeURIComponent(slot));
        showStatus('השעה נפתחה מחדש', 'success');
        setTimeout(loadSlots, 1500);
    }
</script>
</body>
</html>
